apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse-langfuse
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: clickhouse
      defaultDatabase: default
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
